<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="description" content="Contact page">
  <meta name="author" content="Aydan">
  <title>Contact - My Website</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>

  <header>
    <h1>Contact Me</h1>
  </header>

  
  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="education.html">Education</a>
    <a href="schedule.html">Weekly Schedule</a>
    <a href="gallery.html">Gallery</a>
    <a href="contact.html" class="active">Contact</a>
    <a href="questionnaire.html">Questionnaire</a>
  </nav>

  <hr>

  <main class="container my-4">
    <div class="row justify-content-center">
      <!-- Contact Form using Bootstrap grid + components -->
      <div class="col-lg-8">
        <div class="card shadow-sm mb-4">
          <div class="card-body">
            <h3 class="card-title mb-4">Send me a message</h3>
            
            <form action="mailto:amaliki17577@ada.edu.az" method="post" enctype="text/plain">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="name" class="form-label">Full Name</label>
                  <input type="text" id="name" name="name" class="form-control" required>
                </div>
                
                <div class="col-md-6 mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input type="email" id="email" name="email" class="form-control" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="reason" class="form-label">Reason for Contact</label>
                <select id="reason" name="reason" class="form-select">
                  <option value="feedback">Feedback</option>
                  <option value="question">Question</option>
                  <option value="other">Other</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="message" class="form-label">Message</label>
                <textarea id="message" name="message" rows="5" class="form-control" required></textarea>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">Send Message</button>
                <button type="reset" class="btn btn-outline-secondary">Clear</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Contact info -->
      <div class="col-lg-4">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Contact Information</h5>
            <p class="card-text contact-info">
              <strong>Email:</strong><br>
              amaliki17577@ada.edu.az
            </p>
            <p class="card-text">
              <strong>University:</strong><br>
              ADA University
            </p>
            <a href="https://github.com/aydanmaliki/web1capstone-website" class="btn btn-outline-primary btn-sm" target="_blank">
              Visit My GitHub
            </a>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <hr>
    <p>© 2025 Aydan</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
